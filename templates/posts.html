<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postlar</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1f2330;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
            --shadow-hover: 0 10px 24px rgba(16, 24, 40, 0.10);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --card: #181b24;
                --text: #e6e8ee;
                --muted: #9aa1b2;
                --border: #262a36;
                --accent: #818cf8;
                --shadow: none;
                --shadow-hover: 0 10px 24px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 48px 16px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .page-header h1::after {
            content: "";
            display: block;
            width: 48px;
            height: 4px;
            margin-top: 10px;
            border-radius: 2px;
            background: var(--accent);
        }

        .posts {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .post {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .post:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .post h2 {
            font-size: 1.25rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .post p {
            color: var(--muted);
            margin-bottom: 16px;
            overflow-wrap: break-word;
        }

        .post time {
            display: inline-block;
            font-size: 0.8rem;
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--bg);
            border: 1px solid var(--border);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 16px;
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 16px;
            }

            .page-header h1 {
                font-size: 1.6rem;
            }

            .post {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Postlar</h1>
        </header>

        <main class="posts">
            {% for post in posts %}
                <article class="post">
                    <h2>{{ post.title }}</h2>
                    <p>{{ post.about|linebreaksbr }}</p>
                    <time>{{ post.created_at }}</time>
                </article>
            {% empty %}
                <div class="empty">Hozircha postlar yo'q.</div>
            {% endfor %}
        </main>
    </div>
</body>
</html>
